<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#17181d">
<title>ლაივ ბილეთები</title>
<script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* lb-v2 · SofaScore-style layout: app bar, all-tickets overview, ticket tabs, ticket summary, match rows with expandable details. */
:root{
  --bg:#0f1013;--card:#191a1f;--card2:#212329;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.15);
  --n1:#f3f4f6;--n2:rgba(243,244,246,.78);--n3:rgba(243,244,246,.62);
  --pri:#8592ff;--pri-bg:rgba(133,146,255,.16);
  --bar:#17181d;--onbar:#f3f4f6;--onbar2:rgba(243,244,246,.74);--barbtn:rgba(255,255,255,.08);
  --home:#8592ff;--on-home:#0c1140;--away:#35d0da;--on-away:#05272a;
  --won:#34c972;--won-bg:rgba(52,201,114,.15);--lost:#ff5d6e;--lost-bg:rgba(255,93,110,.14);
  --warn:#f1b54c;--warn-bg:rgba(241,181,76,.15);--live:#ff3d52;--good:#34c972;--bad:#ff5d6e;
  --toast:#f3f4f6;--on-toast:#14151a;--shadow:0 0 0 rgba(0,0,0,0);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#edf0f4;--card:#fff;--card2:#f4f6f9;--line:rgba(18,20,28,.09);--line2:rgba(18,20,28,.17);
  --n1:#14151a;--n2:rgba(20,21,26,.76);--n3:rgba(20,21,26,.62);
  --pri:#374df5;--pri-bg:rgba(55,77,245,.1);
  --bar:#374df5;--onbar:#fff;--onbar2:rgba(255,255,255,.86);--barbtn:rgba(255,255,255,.17);
  --home:#374df5;--on-home:#fff;--away:#08838d;--on-away:#fff;
  --won:#0a8f40;--won-bg:rgba(10,143,64,.1);--lost:#d0233a;--lost-bg:rgba(208,35,58,.08);
  --warn:#94600b;--warn-bg:rgba(230,160,40,.16);--live:#e3203a;--good:#0a8f40;--bad:#d0233a;
  --toast:#14151a;--on-toast:#fff;--shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#edf0f4;--card:#fff;--card2:#f4f6f9;--line:rgba(18,20,28,.09);--line2:rgba(18,20,28,.17);
  --n1:#14151a;--n2:rgba(20,21,26,.76);--n3:rgba(20,21,26,.62);
  --pri:#374df5;--pri-bg:rgba(55,77,245,.1);
  --bar:#374df5;--onbar:#fff;--onbar2:rgba(255,255,255,.86);--barbtn:rgba(255,255,255,.17);
  --home:#374df5;--on-home:#fff;--away:#08838d;--on-away:#fff;
  --won:#0a8f40;--won-bg:rgba(10,143,64,.1);--lost:#d0233a;--lost-bg:rgba(208,35,58,.08);
  --warn:#94600b;--warn-bg:rgba(230,160,40,.16);--live:#e3203a;--good:#0a8f40;--bad:#d0233a;
  --toast:#14151a;--on-toast:#fff;--shadow:0 1px 2px rgba(16,24,40,.06);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--n1);font:15px/1.45 "Noto Sans Georgian",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit}

/* app bar */
.bar{position:sticky;top:0;z-index:10;background:var(--bar);color:var(--onbar);padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:18px;font-weight:700;line-height:1.3}
.brand .sub{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--onbar2);white-space:nowrap;overflow:hidden;font-variant-numeric:tabular-nums}
.livei{display:inline-flex;align-items:center;gap:6px}
.livei.on{color:var(--onbar);font-weight:600}
.livei.on::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:0 0 0 2px rgba(255,255,255,.18);animation:p 1.4s infinite}
.ib{flex:none;width:40px;height:40px;border-radius:10px;border:0;background:var(--barbtn);color:var(--onbar);font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer}
.ib:focus-visible,.tab:focus-visible,.row:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
@keyframes p{50%{opacity:.3}}

/* layout */
.wrap{max-width:1080px;margin:0 auto;padding:12px 16px calc(32px + env(safe-area-inset-bottom,0px))}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* overview */
.ov{padding:14px 16px}
.ov-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ov-h h2{margin:0;font-size:16px;font-weight:700}
.ov-h .cap{font-size:13px;color:var(--n2)}
.ov-pot{text-align:right}
.ov-pot b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.ov-pot span{font-size:13px;color:var(--n2)}
.ov-g{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.ov-g div{background:var(--card2);border-radius:10px;padding:8px 10px}
.ov-g b{display:block;font-size:20px;line-height:1.2;font-variant-numeric:tabular-nums}
.ov-g span{font-size:13px;color:var(--n2)}
.ov-g .won b{color:var(--won)}.ov-g .lost b{color:var(--lost)}.ov-g .live b{color:var(--pri)}
.ov-won{margin-top:10px;font-size:14px;color:var(--n2)}
.ov-won b{color:var(--won);font-variant-numeric:tabular-nums}

/* ticket tabs */
.tabs{position:relative;display:flex;gap:8px;overflow-x:auto;margin:12px -16px 0;padding:0 16px 4px;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 186px;scroll-snap-align:start;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:3px;box-shadow:var(--shadow)}
.tab.sel{border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.tab-n{font-weight:600;font-size:14px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab-m{font-size:13px;color:var(--n2);font-variant-numeric:tabular-nums}
.tab-p{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.3}
.tab-p.won{color:var(--won)}
.tab-p.lost{color:var(--n3);text-decoration:line-through;text-decoration-thickness:1px}
.tab-f{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:3px}
.dots{display:flex;gap:4px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line2)}
.dot.won{background:var(--won)}.dot.lost{background:var(--lost)}.dot.refund{background:var(--warn)}
.dot.on{background:var(--live);animation:p 1.4s infinite}
.dot.pd{background:var(--pri)}

/* date switcher */
.dates{position:relative;display:flex;gap:8px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px 2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.dates::-webkit-scrollbar{display:none}
.dt{flex:none;min-width:138px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;display:grid;gap:2px;box-shadow:var(--shadow)}
.dt.sel{background:var(--pri-bg);border-color:var(--pri);box-shadow:inset 0 0 0 1px var(--pri)}
.dt-t{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700;font-size:15px;line-height:1.35}
.dt-s{font-size:13px;color:var(--n2);white-space:nowrap}
.dt .dots{gap:3px}
.dt:focus-visible{outline:2px solid var(--pri);outline-offset:2px}

/* crests */
.cr{position:relative;flex:none;width:22px;height:22px;display:inline-grid;place-items:center}
.cr img{width:100%;height:100%;object-fit:contain;display:block}
.cr.nf{border-radius:50%;background:var(--line2);color:var(--n2);font-size:12px;font-weight:700;line-height:1}
.cr.nf::before{content:attr(data-i)}
.cr.sm{width:18px;height:18px}
.cr.sm.nf{font-size:10px}
.cr.cp{width:20px;height:20px}
.cr.cp.nf{border-radius:5px}
.tab-r{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tab-c{display:flex;flex:none}
.tab-c .cr{margin-left:-5px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--card)}
.tab-c .cr:first-child{margin-left:0}
.tab-c .cr.nf{background:var(--card2);color:var(--n2)}

.pill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap;line-height:1.45}
.pill.live{background:var(--pri-bg);color:var(--pri)}
.pill.won{background:var(--won-bg);color:var(--won)}
.pill.lost{background:var(--lost-bg);color:var(--lost)}

@media (min-width:900px){
  .wrap{display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start;padding-top:20px}
  .side{position:sticky;top:84px}
  .tabs{flex-direction:column;overflow:visible;margin:12px 0 0;padding:0}
  .tab{flex:none;width:auto}
  .dates{grid-column:1/-1;margin:0;padding:0}
}

/* banner + states */
.banner{margin:12px 0 0;padding:10px 14px;border-radius:12px;font-size:14px;background:var(--lost-bg);color:var(--lost);border:1px solid var(--line2)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
@media (min-width:900px){.banner{margin:0 0 12px}}
.empty{padding:36px 16px;text-align:center;color:var(--n2);font-size:15px}
.spin{width:26px;height:26px;margin:0 auto 12px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--pri);animation:r .9s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}

/* ticket summary */
.tk{margin-top:12px;padding:14px 16px}
@media (min-width:900px){.tk{margin-top:0}}
.tk-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.tk-h h2{margin:0;font-size:18px;font-weight:700;line-height:1.3;min-width:0}
.tk-meta{font-size:14px;color:var(--n2);margin-top:2px}
.tk-n{display:grid;grid-template-columns:auto auto 1fr;gap:18px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.tk-n span{display:block;font-size:13px;color:var(--n2)}
.tk-n b{font-size:17px;font-variant-numeric:tabular-nums}
.tk-n .big{text-align:right}
.tk-n .big b{font-size:22px;line-height:1.2}
.tk-n .big b.won{color:var(--won)}
.tk-n .big b.lost{color:var(--n3);text-decoration:line-through;text-decoration-thickness:1px}
.seg{display:flex;gap:4px;margin-top:14px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--line2)}
.seg i.won{background:var(--won)}.seg i.lost{background:var(--lost)}.seg i.refund{background:var(--warn)}
.seg i.on{background:var(--live);animation:p 1.4s infinite}
.tk-f{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--n2);margin-top:8px;font-variant-numeric:tabular-nums}
.tk-f .lv{color:var(--live);font-weight:600}

/* match list */
.list{margin-top:12px;overflow:hidden}
.grp{display:flex;align-items:center;gap:8px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--n2);background:var(--card2);border-top:1px solid var(--line)}
.grp:first-child{border-top:0}
.ev{border-top:1px solid var(--line)}
.grp+.ev{border-top:0}
.ev.won{background:linear-gradient(90deg,var(--won-bg),transparent 60%)}
.ev.lost{background:linear-gradient(90deg,var(--lost-bg),transparent 60%)}
.row{display:grid;grid-template-columns:52px minmax(0,1fr) 58px;column-gap:12px;row-gap:8px;padding:12px 14px 12px 8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.clk{grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:13px;color:var(--n2);border-right:1px solid var(--line);font-variant-numeric:tabular-nums;line-height:1.35}
.clk .ko.big{font-size:15px;color:var(--n1);font-weight:600}
.clk .stt{font-weight:600}
.clk .stt.live{color:var(--live);font-weight:700}
.clk .stt.brk{color:var(--warn);font-weight:700}
.teams{grid-row:1;min-width:0;align-self:center;display:grid;gap:5px}
.tr{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px;line-height:1.4;min-height:24px}
.tr .nm{display:flex;align-items:center;gap:8px;min-width:0}
.tr .tn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .sc{font-weight:700;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.tr.dim{color:var(--n2)}.tr.dim .sc{font-weight:500}
.ev.on .tr .sc{color:var(--live)}
.rc{flex:none;display:inline-block;width:8px;height:11px;border-radius:2px;background:#e8243b;margin-left:-2px}
.odd{grid-row:1;align-self:center;height:42px;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:15px;background:var(--card2);border:1px solid var(--line2);font-variant-numeric:tabular-nums}
.odd.won{background:var(--won-bg);color:var(--won);border-color:var(--won)}
.odd.lost{background:var(--lost-bg);color:var(--lost);border-color:var(--lost)}
.odd.refund{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.odd.good{box-shadow:inset 0 -3px 0 var(--good)}.odd.warn{box-shadow:inset 0 -3px 0 var(--warn)}.odd.bad{box-shadow:inset 0 -3px 0 var(--bad)}
.chips{grid-column:2/4;grid-row:2;display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.chip{display:inline-flex;align-items:center;gap:5px;max-width:100%;font-size:14px;font-weight:600;line-height:1.4;border-radius:7px;padding:3px 9px;background:var(--pri-bg);color:var(--pri)}
.chip i{font-style:normal;font-weight:700}
.chip.won{background:var(--won-bg);color:var(--won)}.chip.lost{background:var(--lost-bg);color:var(--lost)}.chip.refund{background:var(--warn-bg);color:var(--warn)}
.bb{font-size:13px;font-weight:700;color:var(--n2);border:1px solid var(--line2);border-radius:6px;padding:2px 6px;line-height:1.35}
.chev{margin-left:auto;flex:none;width:9px;height:9px;border-right:2px solid var(--n3);border-bottom:2px solid var(--n3);transform:rotate(45deg);margin-right:6px;margin-top:-4px;transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(-135deg);margin-top:4px}
.lerr{grid-column:2/4;grid-row:3;font-size:13px;color:var(--lost)}
.lerr.idle{color:var(--n2)}

/* details */
.det{margin:0 12px 12px;padding:12px 14px;border-radius:12px;background:var(--card2);display:grid;gap:14px}
.det h3{margin:0 0 6px;font-size:14px;font-weight:600;color:var(--n2)}
.cd{display:flex;gap:9px;align-items:flex-start;font-size:15px;padding:3px 0}
.cd i{flex:none;width:20px;height:20px;margin-top:1px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;background:var(--line2);color:var(--n1)}
.cd.won i{background:var(--won);color:#fff}.cd.lost i{background:var(--lost);color:#fff}.cd.refund i{background:var(--warn);color:#fff}
.cd.won{color:var(--won)}.cd.lost{color:var(--lost)}.cd.refund{color:var(--warn)}
.cd.pending.good{color:var(--good)}.cd.pending.warn{color:var(--warn)}.cd.pending.bad{color:var(--bad)}
.htl{font-size:14px;color:var(--n1);background:var(--card);border-radius:8px;padding:7px 10px;font-variant-numeric:tabular-nums}
.muted{margin:0;font-size:14px;color:var(--n2)}
.derr{margin:0;font-size:14px;color:var(--lost)}
.tl-r{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:14px}
.tl-r.away{flex-direction:row-reverse;text-align:right}
.tl-m{flex:none;min-width:38px;font-weight:600;color:var(--n2);font-variant-numeric:tabular-nums}
.tl-r.away .tl-m{text-align:right}
.tl-x{min-width:0}
.tl-x b{font-weight:600}
.tl-s{flex:none;font-weight:700;background:var(--card);border-radius:6px;padding:0 7px;font-variant-numeric:tabular-nums}
.ic-g{flex:none;width:16px;height:16px;color:var(--n1)}
.ic-r{flex:none;width:10px;height:13px;border-radius:2px;background:#e8243b;margin:0 3px}
.tl-d{text-align:center;font-size:13px;font-weight:600;color:var(--n2);padding:5px 0;margin:4px 0;border-top:1px solid var(--line2);border-bottom:1px solid var(--line2);font-variant-numeric:tabular-nums}
.sx-h{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;color:var(--n2);margin-bottom:4px}
.sx-h span{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;white-space:nowrap}
.sx-h span:last-child{justify-content:flex-end}
.sx{padding:6px 0}
.sx-top{display:grid;grid-template-columns:52px 1fr 52px;align-items:center;font-size:14px}
.sx-l{text-align:center}
.sx-v{justify-self:start;font-weight:700;padding:1px 8px;border-radius:7px;font-variant-numeric:tabular-nums}
.sx-v.a{justify-self:end}
.sx-v.h.hi{background:var(--home);color:var(--on-home)}.sx-v.a.hi{background:var(--away);color:var(--on-away)}
.sx-bars{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.sx-b{height:6px;border-radius:3px;background:var(--line);display:flex;overflow:hidden}
.sx-b.h{justify-content:flex-end}
.sx-b i{display:block;height:100%;border-radius:3px;opacity:.45}
.sx-b.h i{background:var(--home)}.sx-b.a i{background:var(--away)}
.sx-b.hi i{opacity:1}

.foot{font-size:13px;color:var(--n2);text-align:center;margin:16px 0 0}

/* toasts */
.toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;display:grid;gap:8px;justify-items:center;padding:0 16px;pointer-events:none}
.toast{pointer-events:auto;cursor:pointer;width:100%;max-width:440px;display:flex;gap:10px;align-items:stretch;background:var(--toast);color:var(--on-toast);border-radius:12px;padding:11px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);font-size:14px;animation:tin .2s ease-out}
.toast .tb{flex:none;width:4px;border-radius:2px;background:var(--pri)}
.toast.won .tb{background:var(--won)}.toast.lost .tb,.toast.red .tb{background:var(--lost)}.toast.refund .tb{background:var(--warn)}.toast.goal .tb{background:var(--live)}
.toast b{display:block;font-size:15px}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){.livei.on::before,.dot.on,.seg i.on,.spin{animation:none}.toast{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <div class="brand">
    <h1>ლაივ ბილეთები</h1>
    <div class="sub"><span class="livei" id="live">იტვირთება…</span><span id="upd"></span></div>
  </div>
  <button class="ib" id="bell" type="button" aria-pressed="false" title="ხმა გოლზე და შესრულებულ პოზიციაზე">🔕</button>
  <button class="ib" id="theme" type="button" title="თემის შეცვლა">◐</button>
</div></header>
<main class="wrap">
  <nav class="dates" id="dates" aria-label="თარიღები"></nav>
  <aside class="side">
    <div class="card ov" id="ov"><div class="empty" style="padding:8px"><div class="spin"></div>იტვირთება…</div></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="ბილეთები"></nav>
  </aside>
  <section class="content">
    <div id="banner"></div>
    <div id="view" role="tabpanel"></div>

      <div class="tk-n"><div><span>ფსონი</span><b>${t.stake} ₾</b></div><div><span>კოეფიციენტი</span><b>${t.odds.toFixed(2)}</b></div>
        <div class="big"><span>${potLbl}</span><b class="${potCls}">${t.potential.toFixed(2)} ₾</b></div></div>
      <div class="seg">${legs.map(x => `<i class="${dotCls(x.l)}"></i>`).join('')}</div>
      <div class="tk-f"><span>${t.settled}/${t.legs.length} დასრულდა${effNote}</span>${liveN ? `<span class="lv">ლაივში ${liveN}</span>` : next ? `<span>შემდეგი ${tbs(next)}</span>` : ''}</div>
    </div>
    <div class="card list">${groups.map(g => `${g.c ? `<div class="grp">${crest(compLogo(g.items[0].l), g.c, 'Competitions', 'cp')}<span>${esc(g.c)}</span></div>` : ''}${g.items.map(x => legRow(t, x.l, x.i)).join('')}`).join('')}</div>`;
}
function bannerView() {
  if (!CFG && cfgErr) return `<div class="banner">ბილეთების ფაილი ვერ ჩაიტვირთა (${esc(ERR(cfgErr))}) · ვცდი ხელახლა</div>`;
  if (navigator.onLine === false) return '<div class="banner">ინტერნეტი არ არის · ნაჩვენებია ბოლო მონაცემები</div>';
  if (lastErr && lastErr > lastOk && (!lastOk || lastErr - lastOk > 45e3))
    return `<div class="banner warn">365Scores არ პასუხობს (${esc(ERR(lastErrMsg))})${lastOk ? ' · ბოლო განახლება ' + hms(lastOk) : ''} · ვცდი ხელახლა</div>`;
  return '';
}
function render(state) {
  if (!state) {
    $('#banner').innerHTML = bannerView();
    if (!CFG) { $('#view').innerHTML = cfgErr ? '' : '<div class="card empty"><div class="spin"></div>იტვირთება…</div>'; if (cfgErr) { $('#ov').innerHTML = '<div class="empty" style="padding:8px">მონაცემები არ არის</div>'; $('#live').textContent = 'კავშირი არ არის'; } }
    return;
  }
  lastState = state;
  const ds = datesOf(state); selDate = pickDate(state, ds);
  const day = state.filter(t => dkey(t) === selDate);
  sel = pickSel(day);
  const ms = new Map(); for (const t of state) for (const l of t.legs) if (l.m) ms.set(l.id, l.m);
  const all = [...ms.values()], liveN = all.filter(m => m.ongoing).length;
  const next = all.filter(m => !m.started && !m.cancelled).map(m => m.utc).sort()[0];
  const lv = $('#live'); lv.className = 'livei' + (liveN ? ' on' : '');
  lv.textContent = liveN ? `ლაივში ${liveN} მატჩი` : next ? `შემდეგი ${tbs(next)}` : ms.size ? 'ლაივ მატჩი არ არის' : 'იტვირთება…';
  $('#upd').textContent = lastOk ? 'განახლდა ' + hms(lastOk) : '';
  const dz = $('#dates'), dsl = dz.scrollLeft; dz.innerHTML = datesView(state, ds); dz.scrollLeft = dsl;
  if (!datesInit && ds.length) { datesInit = true; const el = [...dz.children].find(x => x.dataset.d === selDate); if (el && el.offsetLeft + el.offsetWidth > dz.clientWidth) dz.scrollLeft = el.offsetLeft - 16; }
  $('#ov').innerHTML = day.length ? overview(day) : '<div class="empty" style="padding:8px">ბილეთები ჯერ არ არის</div>';
  const tabs = $('#tabs'), sl = tabs.scrollLeft; tabs.innerHTML = tabsView(day); tabs.scrollLeft = sl;
  if (!tabsInit) { tabsInit = true; const el = [...tabs.children].find(x => x.dataset.t === sel); if (el && el.offsetLeft + el.offsetWidth > tabs.clientWidth) tabs.scrollLeft = el.offsetLeft - 16; }
  $('#banner').innerHTML = bannerView();
  const t = day.find(x => x.key === sel);
  $('#view').innerHTML = t ? ticketView(t) : '<div class="card empty">ბილეთები ჯერ არ არის</div>';
}
function selectTicket(k) {
  const tk = lastState && lastState.find(t => t.key === k); if (!tk) return;
  if (dkey(tk) !== selDate) { selDate = dkey(tk); storeDate(selDate, datesOf(lastState)); $('#tabs').scrollLeft = 0; }
  sel = k; try { history.replaceState(null, '', '#' + k); } catch {}
  render(lastState);
  const el = [...document.querySelectorAll('.tab')].find(x => x.dataset.t === k), tabs = $('#tabs');
  if (el && tabs.scrollWidth > tabs.clientWidth) tabs.scrollTo({ left: Math.max(0, el.offsetLeft - 16), behavior: 'smooth' });
  const v = $('#view'); if (v.getBoundingClientRect().top < 0) v.scrollIntoView({ block: 'start' });
}
function selectDate(d) {
  if (!lastState) return;
  selDate = d; storeDate(d, datesOf(lastState)); sel = null; $('#tabs').scrollLeft = 0;
  if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch {}
  render(lastState);
}
function toggleRow(row) {
  const k = row.closest('.ev')?.dataset.k; if (!k) return;
  open.set(k, row.getAttribute('aria-expanded') !== 'true');
  if (lastState) render(lastState);
}
document.addEventListener('click', e => {
  const dt = e.target.closest('.dt'); if (dt) return selectDate(dt.dataset.d);
  const tab = e.target.closest('.tab'); if (tab) return selectTicket(tab.dataset.t);
  const row = e.target.closest('.row'); if (row) return toggleRow(row);
  const ts = e.target.closest('.toast'); if (ts) { if (ts.dataset.t) selectTicket(ts.dataset.t); ts.remove(); }
});
document.addEventListener('keydown', e => {
  const row = e.target.closest && e.target.closest('.row');
  if (row && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleRow(row); }
});
window.addEventListener('hashchange', () => selectTicket(decodeURIComponent(location.hash.slice(1))));

// Draw as soon as each match arrives, so one slow response never blanks the page.
let paintT = 0;
function paint() { clearTimeout(paintT); paintT = setTimeout(() => { if (!CFG) return render(null); const s = build(); diff(s); render(s); }, 60); }
let busy = false, busySince = 0, fails = 0;
async function tick(force) {
  if (busy && Date.now() - busySince < 30e3) return; busy = true; busySince = Date.now();
  try {
    if (!CFG) await loadConfig(); paint(); await refresh(force); paint();
    const anyOk = [...cache.values()].some(c => !c.err); fails = anyOk ? 0 : fails + 1;
  } catch (e) { fails++; if (!CFG) cfgErr = String(e.message || e); render(CFG ? lastState : null); }
  finally { busy = false; }
}
render(null);
tick(true); setInterval(() => tick(false), 10e3);
setInterval(() => { loadConfig().catch(() => {}); }, 3 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(true); });
window.addEventListener('online', () => tick(true));
</script>
