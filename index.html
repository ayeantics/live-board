<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#374df5">
<title>ლაივ ბილეთები</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky app bar, ticket summary cards, then one row per leg with only the stats that leg needs. */
:root{
  --s0:#edf1f6;--s1:#ffffff;--s2:#f3f5f9;
  --n1:#1d1d22;--n2:rgba(29,29,34,.74);--n3:rgba(29,29,34,.52);--n4:rgba(29,29,34,.13);
  --pri:#374df5;--appbar:#374df5;--onbar:#fff;
  --home:#374df5;--away:#0aa6b2;
  --won:#0b9e2b;--won-bg:rgba(11,158,43,.11);
  --lost:#d6273d;--lost-bg:rgba(214,39,61,.09);
  --warn:#a86b10;--warn-bg:rgba(230,160,40,.16);
  --live:#e8243b;--good:#0b9e2b;--bad:#d6273d;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --s0:#111115;--s1:#1b1b21;--s2:#24242b;
  --n1:#fff;--n2:rgba(255,255,255,.76);--n3:rgba(255,255,255,.52);--n4:rgba(255,255,255,.13);
  --pri:#8b98ff;--appbar:#1b1b21;--onbar:#fff;--home:#7c8bff;--away:#2fd0db;
  --won:#3ccf5e;--won-bg:rgba(60,207,94,.13);--lost:#ff5a6e;--lost-bg:rgba(255,90,110,.12);
  --warn:#f2b445;--warn-bg:rgba(242,180,69,.14);--live:#ff4d5e;--good:#3ccf5e;--bad:#ff5a6e;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --s0:#111115;--s1:#1b1b21;--s2:#24242b;
  --n1:#fff;--n2:rgba(255,255,255,.76);--n3:rgba(255,255,255,.52);--n4:rgba(255,255,255,.13);
  --pri:#8b98ff;--appbar:#1b1b21;--onbar:#fff;--home:#7c8bff;--away:#2fd0db;
  --won:#3ccf5e;--won-bg:rgba(60,207,94,.13);--lost:#ff5a6e;--lost-bg:rgba(255,90,110,.12);
  --warn:#f2b445;--warn-bg:rgba(242,180,69,.14);--live:#ff4d5e;--good:#3ccf5e;--bad:#ff5a6e;color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--s0);color:var(--n1);font:15px/1.45 "Noto Sans Georgian","Segoe UI",system-ui,sans-serif}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--appbar);color:var(--onbar);border-bottom:1px solid var(--n4)}
.bar-in{max-width:880px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.bar h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0}
.upd{font-size:13px;opacity:.85;font-variant-numeric:tabular-nums}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:var(--onbar);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px;cursor:pointer}
.btn[aria-pressed="true"]{background:#fff;color:#374df5}
.btn:focus-visible{outline:2px solid #fff;outline-offset:2px}
main{max-width:880px;margin:0 auto;padding:14px 16px 28px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-bottom:16px}
.card{background:var(--s1);border:1px solid var(--n4);border-radius:12px;padding:12px 14px;text-decoration:none;color:inherit;display:block}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600}
.card .money{font-size:21px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.card .sub{font-size:14px;color:var(--n2)}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.live{background:var(--warn-bg);color:var(--warn)}
.pill.won{background:var(--won-bg);color:var(--won)}
.pill.lost{background:var(--lost-bg);color:var(--lost)}
.dots{display:flex;gap:5px;margin-top:8px}
.dot{width:11px;height:11px;border-radius:50%;background:var(--n4)}
.dot.won{background:var(--won)}.dot.lost{background:var(--lost)}.dot.refund{background:var(--warn)}
.dot.on{background:var(--live);animation:p 1.4s infinite}
section{margin-bottom:20px}
.sec-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 8px;margin:0 2px 8px}
.sec-h h2{font-size:17px;margin:0;display:flex;gap:8px;align-items:center}
.sec-h .meta{font-size:14px;color:var(--n2)}
.legs{background:var(--s1);border:1px solid var(--n4);border-radius:12px;overflow:hidden}
.leg{display:grid;grid-template-columns:52px minmax(0,1fr) 60px;gap:10px;padding:12px 14px;border-top:1px solid var(--n4)}
.leg:first-child{border-top:0}
.leg.lost{background:var(--lost-bg)}.leg.won{background:var(--won-bg)}
.clock{font-size:14px;color:var(--n2);text-align:center;padding-top:20px;font-variant-numeric:tabular-nums}
.clock.on{color:var(--live);font-weight:700}
.clock.on::before{content:"";display:block;width:8px;height:8px;border-radius:50%;background:var(--live);margin:0 auto 4px;animation:p 1.4s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.clock.on::before,.dot.on{animation:none}}
.comp{font-size:13px;color:var(--n3);margin-bottom:2px}
.tm{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.tm b{font-size:16px;min-width:18px;text-align:right;font-variant-numeric:tabular-nums}
.bet{display:inline-block;margin:6px 0 4px;font-size:14px;font-weight:600;color:var(--pri);background:color-mix(in srgb,var(--pri) 12%,transparent);border-radius:6px;padding:2px 8px}
.cond{font-size:14px;display:flex;gap:6px;align-items:flex-start;margin-top:3px}
.cond i{font-style:normal;width:18px;text-align:center;flex:none}
.cond.won{color:var(--won)}.cond.lost{color:var(--lost)}.cond.refund{color:var(--warn)}
.cond.pending.good{color:var(--good)}.cond.pending.bad{color:var(--bad)}.cond.pending.warn{color:var(--warn)}
.ev{font-size:13px;color:var(--n2);margin-top:6px}
.stats{margin-top:10px;display:grid;gap:7px}
.st-h{font-size:12px;color:var(--n3);display:flex;justify-content:space-between}
.st{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.st .v{font-weight:600}.st .v.r{text-align:right}
.st .mid{display:grid;gap:3px}
.st .lbl{font-size:12px;color:var(--n2);text-align:center}
.st .bars{display:grid;grid-template-columns:1fr 1fr;gap:3px;height:6px}
.st .bh,.st .ba{background:var(--s2);border-radius:3px;overflow:hidden;display:flex}
.st .bh{justify-content:flex-end}
.st .bh span{background:var(--home);border-radius:3px}.st .ba span{background:var(--away);border-radius:3px}
.mom{margin-top:8px}
.mom svg{display:block;width:100%;height:34px}
.mom .cap{font-size:12px;color:var(--n3);display:flex;justify-content:space-between}
.odds{align-self:center;text-align:center;font-weight:700;font-size:16px;border-radius:8px;padding:8px 0;background:var(--s2);font-variant-numeric:tabular-nums}
.odds.won{background:var(--won);color:#fff}.odds.lost{background:var(--lost);color:#fff}.odds.refund{background:var(--warn);color:#fff}
.err{font-size:13px;color:var(--lost);margin-top:4px}
.note{font-size:13px;color:var(--n3);text-align:center;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--n1);color:var(--s1);padding:10px 16px;border-radius:10px;font-size:15px;font-weight:600;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.25)}
@media (max-width:520px){.leg{grid-template-columns:44px minmax(0,1fr) 54px;gap:8px;padding:12px}.bar h1{font-size:16px}.upd{display:none}}
</style>
</head>
<body>
<div class="bar"><div class="bar-in">
  <h1>ლაივ ბილეთები</h1>
  <span class="upd" id="upd">…</span>
  <button class="btn" id="bell" aria-pressed="false" title="ხმა გოლზე და შესრულებულ პოზიციაზე">🔔</button>
  <button class="btn" id="theme" title="თემის შეცვლა">◐</button>
</div></div>
<main>
  <div class="sum" id="sum"></div>
  <div id="list"><p class="note">იტვირთება…</p></div>
  <p class="note">მონაცემები: 365Scores, ახლდება ~20 წამში · ოფიციალური ანგარიშსწორება: Crocobet</p>
</main>
<div class="toast" id="toast" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ICON = { won:'✓', lost:'✗', refund:'↺', pending:'•' };
const ST = { live:'ცოცხალია', won:'მოგებულია', lost:'წაგებულია' };
const TICK = 20e3, IDLE = 5 * 60e3;

/* ---------- theme + alerts ---------- */
const root = document.documentElement;
try { const t = localStorage.getItem('theme'); if (t) root.dataset.theme = t; } catch {}
$('#theme').onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
};
let alerts = false, actx = null;
try { alerts = localStorage.getItem('alerts') === '1'; } catch {}
const bell = $('#bell'); bell.setAttribute('aria-pressed', alerts);
bell.onclick = async () => {
  alerts = !alerts; bell.setAttribute('aria-pressed', alerts);
  try { localStorage.setItem('alerts', alerts ? '1' : '0'); } catch {}
  if (alerts) {
    try { actx = actx || new AudioContext(); } catch {}
    try { if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); } catch {}
    beep(660); toast('ხმა ჩართულია');
  } else toast('ხმა გამორთულია');
};
function beep(f = 880) {
  if (!alerts) return;
  try { actx = actx || new AudioContext(); const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(.18, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001, actx.currentTime + .55); o.start(); o.stop(actx.currentTime + .55); } catch {}
  try { navigator.vibrate && navigator.vibrate(200); } catch {}
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 6000); }
function notify(title, body, f) {
  toast(title + ' — ' + body);
  if (!alerts) return; beep(f);
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification(title, { body }); } catch {}
}

/* ---------- 365Scores parsing (the phone reads it directly, no PC needed) ---------- */
const tbs = iso => new Date(new Date(iso).getTime() + 4 * 3600e3).toISOString().slice(11, 16);
const num = v => { const n = parseFloat(String(v)); return isNaN(n) ? 0 : n; };
function parseMatch(g, statsJson) {
  const hid = g.homeCompetitor.id, aid = g.awayCompetitor.id;
  const sideOf = id => id === hid ? 'home' : id === aid ? 'away' : null;
  const txt = String(g.statusText || '');
  const cancelled = /postpon|cancel|abandon|suspend/i.test(txt);
  const finished = g.statusGroup === 4 && !cancelled, ongoing = g.statusGroup === 3, started = finished || ongoing;
  const h = Math.max(0, +g.homeCompetitor.score || 0), a = Math.max(0, +g.awayCompetitor.score || 0);
  const ht = (g.stages || []).find(x => x.id === 7);
  const atBreak = /half ?time/i.test(txt);
  const secondHalf = finished || /2nd/i.test(txt) || !!(ht && ht.isEnded && !atBreak);
  const firstHalfOver = finished || atBreak || secondHalf;
  const htScore = ht && firstHalfOver ? { home: Math.max(0, ht.homeCompetitorScore || 0), away: Math.max(0, ht.awayCompetitorScore || 0) } : null;
  const goals = [], reds = [];
  for (const e of g.events || []) {
    const name = e.eventType?.name || '', side = sideOf(e.competitorId);
    const min = (e.gameTime ?? '') + (e.addedTime ? '+' + e.addedTime : '');
    if (e.eventType?.id === 1 && side) {
      const own = /own/i.test(e.eventType.subTypeName || '');
      goals.push({ side: own ? (side === 'home' ? 'away' : 'home') : side, min, own });
    } else if (/red/i.test(name) && side) reds.push({ side, min });
  }
  const stats = {};
  for (const x of statsJson?.statistics || []) {
    const sd = sideOf(x.competitorId); if (!sd) continue;
    (stats[x.id] = stats[x.id] || ['0', '0'])[sd === 'home' ? 0 : 1] = String(x.value);
  }
  const cards = { home: { y: num(stats[1]?.[0]), r: num(stats[2]?.[0]) }, away: { y: num(stats[1]?.[1]), r: num(stats[2]?.[1]) } };
  let clock = tbs(g.startTime);
  if (cancelled) clock = 'გადაიდო'; else if (finished) clock = 'დასრ.'; else if (atBreak) clock = 'შესვ.';
  else if (ongoing) clock = g.gameTimeDisplay || (g.gameTime > 0 ? g.gameTime + "'" : 'LIVE');
  return { started, finished, ongoing, cancelled, firstHalfOver, secondHalf, clock, utc: g.startTime, h, a, htScore, goals, reds, cards, stats };
}
// Goals a side scored in each half, from the half-time score.
function halfGoals(m, side) {
  const cur = side === 'home' ? m.h : m.a;
  if (!m.htScore) return { h1: cur, h2: 0 };
  return { h1: m.htScore[side], h2: cur - m.htScore[side] };
}

/* ---------- settling ---------- */
const other = s => (s === 'home' ? 'away' : 'home');
function evalCond(c, m, names) {
  const g = { home: m.h, away: m.a }, tn = s => names[s];
  const pend = (text, tone = 'neutral') => ({ s: 'pending', text, tone });
  switch (c.type) {
    case 'btts': {
      const need = ['home', 'away'].filter(s => g[s] === 0).map(tn);
      if (!need.length) return { s: 'won', text: 'ორივემ გაიტანა' };
      if (m.finished) return { s: 'lost', text: 'ორივემ ვერ გაიტანა' };
      return pend('ორივე გაიტანს · სჭირდება: ' + need.join(', '), need.length === 1 ? 'good' : 'neutral');
    }
    case 'total_over': {
      const need = Math.floor(c.line) + 1, tot = m.h + m.a;
      if (tot >= need) return { s: 'won', text: `გოლები ${tot}/${need}` };
      if (m.finished) return { s: 'lost', text: `გოლები ${tot}/${need}` };
      return pend(`გოლები ${tot}/${need} · აკლია ${need - tot}`, need - tot === 1 ? 'good' : 'neutral');
    }
    case 'team_over': {
      const need = Math.floor(c.line) + 1, have = g[c.side];
      if (have >= need) return { s: 'won', text: `${tn(c.side)}: ${have}/${need} გოლი` };
      if (m.finished) return { s: 'lost', text: `${tn(c.side)}: ${have}/${need} გოლი` };
      return pend(`${tn(c.side)}: ${have}/${need} გოლი · აკლია ${need - have}`, need - have === 1 ? 'good' : 'neutral');
    }
    case 'win': {
      const d = g[c.side] - g[other(c.side)];
      if (m.finished) return d > 0 ? { s: 'won', text: `${tn(c.side)} მოიგო` } : { s: 'lost', text: `${tn(c.side)} ვერ მოიგო` };
      if (!m.started) return pend(`${tn(c.side)} უნდა მოიგოს`);
      return d > 0 ? pend(`${tn(c.side)} იგებს`, 'good') : d === 0 ? pend('ფრე · საჭიროა გოლი', 'warn') : pend(`${tn(c.side)} აგებს`, 'bad');
    }
    case 'dnb': {
      const d = g[c.side] - g[other(c.side)];
      if (m.finished) return d > 0 ? { s: 'won', text: `${tn(c.side)} მოიგო` } : d === 0 ? { s: 'refund', text: 'ფრე · ბრუნდება (1.00)' } : { s: 'lost', text: `${tn(c.side)} წააგო` };
      if (!m.started) return pend(`${tn(c.side)} · ფრეზე ბრუნდება`);
      return d > 0 ? pend(`${tn(c.side)} იგებს`, 'good') : d === 0 ? pend('ფრე · ახლა ბრუნდება', 'warn') : pend(`${tn(c.side)} აგებს`, 'bad');
    }
    case 'team_both_halves': {
      const hg = halfGoals(m, c.side), h1 = hg.h1 > 0, h2 = hg.h2 > 0;
      const mk = (ok, over) => ok ? '✓' : over ? '✗' : '…';
      const text = `${tn(c.side)}: I ტაიმი ${mk(h1, m.firstHalfOver)} · II ტაიმი ${mk(h2, m.finished)}`;
      if (h1 && h2) return { s: 'won', text };
      if ((m.firstHalfOver && !h1) || (m.finished && !h2)) return { s: 'lost', text };
      return pend(text, h1 ? 'good' : 'neutral');
    }
    case 'most_cards': {
      const pts = s => m.cards[s].y + 2 * m.cards[s].r, me = pts(c.side), op = pts(other(c.side));
      const text = `ბარათები: ${tn(c.side)} ${me} – ${op} ${tn(other(c.side))}`;
      if (m.finished) return me > op ? { s: 'won', text } : { s: 'lost', text };
      if (!m.started) return pend(`${tn(c.side)} მეტ ბარათს უნდა მიიღოს`);
      return pend(text, me > op ? 'good' : me === op ? 'warn' : 'bad');
    }
  }
  return pend('უცნობი პირობა');
}
function combine(list) {
  if (list.some(x => x.s === 'lost')) return 'lost';
  if (list.every(x => x.s === 'won')) return 'won';
  if (list.every(x => x.s === 'won' || x.s === 'refund')) return 'refund';
  return 'pending';
}

/* ---------- which stats each leg needs (365Scores stat ids) ---------- */
const LBL = { 4:'დარტყმა კარში', 24:'დიდი შანსი', 3:'დარტყმები', 8:'კუთხური', 10:'ბურთის ფლობა', 11:'შეტევები', 1:'ყვითელი ბარათი', 2:'წითელი ბარათი', 12:'ფოლი', 13:'ჯარიმის დარტყმა', 23:'მეკარის სეივი' };
const GOALS = [4, 24, 3, 8], RESULT = [4, 24, 10, 3];
const NEED = { btts: GOALS, total_over: GOALS, team_over: GOALS, win: RESULT, dnb: RESULT, team_both_halves: [4, 24, 3], most_cards: [1, 2, 12, 13] };
function statRow(key, pair) {
  const [h, a] = pair, hn = num(h), an = num(a), max = key == 10 ? 100 : Math.max(hn, an, 0.0001);
  const w = v => Math.max(0, Math.min(100, (v / max) * 100)).toFixed(0);
  return `<div class="st"><span class="v">${esc(h)}</span>
    <div class="mid"><div class="lbl">${LBL[key] || key}</div><div class="bars"><div class="bh"><span style="width:${w(hn)}%"></span></div><div class="ba"><span style="width:${w(an)}%"></span></div></div></div>
    <span class="v r">${esc(a)}</span></div>`;
}
function statsBlock(l, m) {
  if (!m || !(m.ongoing || m.finished)) return '';
  let keys = [...new Set(l.conds.flatMap(c => NEED[c.type] || []))].filter(k => m.stats[k]);
  if (keys.includes(12)) keys = keys.filter(k => k !== 13);
  const rows = keys.slice(0, 5).map(k => statRow(k, m.stats[k])).join('');
  let ht = '';
  if (m.htScore && l.conds.some(c => c.type === 'team_both_halves'))
    ht = `<div class="ev">I ტაიმი: ${m.htScore.home}–${m.htScore.away}${m.secondHalf ? ` · II ტაიმი: ${m.h - m.htScore.home}–${m.a - m.htScore.away}` : ''}</div>`;
  if (!rows && !ht) return '';
  return `${ht}<div class="stats">${rows ? `<div class="st-h"><span>${esc(l.names.home)}</span><span>სტატისტიკა</span><span>${esc(l.names.away)}</span></div>${rows}` : ''}</div>`;
}

/* ---------- state ---------- */
let CFG = null; const cache = new Map(); let prev = null;
async function loadConfig() {
  const r = await fetch('tickets.json?v=' + Date.now(), { cache: 'no-store' });
  CFG = await r.json();
}
const API = 'https://webws.365scores.com/web/', Q = 'appTypeId=5&langId=1&timezoneName=UTC&userCountryId=-1';
async function getJSON(u) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), 12e3);
  try { const r = await fetch(u, { cache: 'no-store', signal: ac.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'timeout' : e.message); }
  finally { clearTimeout(t); }
}
async function refresh(force) {
  const ids = [...new Set(CFG.tickets.flatMap(t => t.legs.map(l => String(l.fotmob))))]; const now = Date.now();
  await Promise.all(ids.map(async id => {
    const gid = CFG.matches[id]?.s365; if (!gid) return;
    const c = cache.get(id);
    if (c?.m && (c.m.finished || c.m.cancelled) && c.final) return;
    const soon = c?.m ? new Date(c.m.utc).getTime() - now < 15 * 60e3 : true;
    const every = c?.m?.ongoing || soon ? TICK : IDLE;
    if (!force && c && now - c.at < every - 1500) return;
    try {
      const game = (await getJSON(API + 'game/?' + Q + '&gameId=' + gid)).game;
      const live = game.statusGroup === 3 || game.statusGroup === 4;
      const stats = live ? await getJSON(API + 'game/stats/?' + Q + '&games=' + gid).catch(() => c?.stats || null) : null;
      const m = parseMatch(game, stats);
      cache.set(id, { at: now, m, stats, err: null, final: m.finished && !!c?.m?.finished });
    } catch (e) { cache.set(id, { ...(c || {}), at: now, m: c?.m || null, err: String(e.message || e), final: false }); }
  }));
}

function build() {
  return CFG.tickets.map((t, ti) => {
    const legs = t.legs.map(l => {
      const id = String(l.fotmob), meta = CFG.matches[id] || {}, c = cache.get(id), m = c?.m;
      const names = { home: meta.home || '?', away: meta.away || '?' };
      if (!m) return { ...l, id, names, comp: meta.comp, status: 'pending', conds: [{ s: 'pending', text: 'იტვირთება…', tone: 'neutral' }], m: null, err: c?.err };
      if (m.cancelled) return { ...l, id, names, comp: meta.comp, status: 'refund', conds: [{ s: 'refund', text: 'მატჩი გადაიდო' }], m, err: c.err };
      const conds = l.conds.map(cd => ({ type: cd.type, ...evalCond(cd, m, names) }));
      return { ...l, id, names, comp: meta.comp, status: combine(conds), conds, m, err: c.err };
    });
    const lost = legs.some(l => l.status === 'lost'), eff = legs.reduce((p, l) => p * (l.status === 'refund' ? 1 : l.odds), 1);
    const settled = legs.filter(l => l.status !== 'pending').length;
    return { ...t, key: t.key || 't' + (ti + 1), legs, status: lost ? 'lost' : settled === legs.length ? 'won' : 'live', settled, eff, potential: t.stake * eff };
  });
}
function diff(state) {
  if (!prev) return;
  const goals = {}, legs = {};
  for (const t of prev) for (const l of t.legs) { if (l.m) goals[l.id] = l.m.h + l.m.a; legs[t.key + l.id] = l.status; }
  const seen = new Set();
  for (const t of state) for (const l of t.legs) {
    const m = l.m;
    if (m && !seen.has(l.id) && goals[l.id] !== undefined && m.h + m.a > goals[l.id]) {
      seen.add(l.id); const g = m.goals[m.goals.length - 1];
      notify(`⚽ გოლი${g ? ' ' + g.min + "'" : ''}`, `${l.names.home} ${m.h}–${m.a} ${l.names.away}`, 880);
    }
    const was = legs[t.key + l.id];
    if (was && was !== l.status && l.status !== 'pending')
      notify(l.status === 'won' ? '✓ შესრულდა' : l.status === 'lost' ? '✗ ჩავარდა' : '↺ ბრუნდება', `${t.name}: ${l.names.home} – ${l.names.away}`, l.status === 'won' ? 1046 : 330);
  }
}

/* ---------- render ---------- */
function legRow(l) {
  const m = l.m;
  const clock = m ? `<div class="clock ${m.ongoing ? 'on' : ''}">${esc(m.clock)}</div>` : '<div class="clock">…</div>';
  const sc = s => m && (m.started || m.finished) ? `<b>${s === 'home' ? m.h : m.a}</b>` : '<b></b>';
  const conds = l.conds.map(c => `<div class="cond ${c.s} ${c.tone || ''}"><i>${ICON[c.s]}</i><span>${esc(c.text)}</span></div>`).join('');
  let ev = '';
  if (m) {
    const parts = m.goals.map(g => `⚽ ${esc(g.min)}' ${esc(l.names[g.side])}${g.own ? ' (ავტოგოლი)' : ''}`);
    for (const r of m.reds) parts.push(`🟥 ${esc(r.min)}' ${esc(l.names[r.side])}`);
    if (parts.length) ev = `<div class="ev">${parts.join(' · ')}</div>`;
  }
  return `<div class="leg ${l.status}">${clock}
    <div style="min-width:0">
      ${l.comp ? `<div class="comp">${esc(l.comp)}</div>` : ''}
      <div class="tm"><span>${esc(l.names.home)}</span>${sc('home')}</div>
      <div class="tm"><span>${esc(l.names.away)}</span>${sc('away')}</div>
      <span class="bet">${esc(l.bet)}</span>${conds}${ev}${statsBlock(l, m)}
      ${l.err ? `<div class="err">მონაცემები ვერ ჩაიტვირთა (${esc(l.err)}) · ვცდი ხელახლა</div>` : ''}
    </div>
    <div class="odds ${l.status}">${l.odds.toFixed(2)}</div></div>`;
}
function render(state) {
  $('#upd').textContent = new Date().toLocaleTimeString('en-GB', { hour12: false });
  $('#sum').innerHTML = state.map(t => {
    const dots = t.legs.map(l => `<span class="dot ${l.status === 'pending' ? (l.m?.ongoing ? 'on' : '') : l.status}"></span>`).join('');
    return `<a class="card" href="#${t.key}"><div class="t"><span>${esc(t.name)}</span><span class="pill ${t.status}">${ST[t.status]}</span></div>
      <div class="money">${t.status === 'lost' ? '0.00' : t.potential.toFixed(2)} ₾</div>
      <div class="sub">${t.stake} ₾ × ${t.eff.toFixed(2)} · ${t.settled}/${t.legs.length} დასრულდა</div><div class="dots">${dots}</div></a>`;
  }).join('');
  $('#list').innerHTML = state.map(t => {
    const legs = [...t.legs].sort((a, b) => (a.m?.utc || '').localeCompare(b.m?.utc || ''));
    return `<section id="${t.key}"><div class="sec-h"><h2>${esc(t.name)} <span class="pill ${t.status}">${ST[t.status]}</span></h2>
      <span class="meta">${esc(t.placed)} · ${t.stake} ₾ × ${t.odds.toFixed(2)}</span></div>
      <div class="legs">${legs.map(legRow).join('')}</div></section>`;
  }).join('');
}

let busy = false, busySince = 0, fails = 0;
async function tick(force) {
  if (busy && Date.now() - busySince < 30e3) return; busy = true; busySince = Date.now();
  try {
    if (!CFG) await loadConfig(); await refresh(force); const s = build(); diff(s); prev = s; render(s);
    const anyOk = [...cache.values()].some(c => !c.err); fails = anyOk ? 0 : fails + 1;
  } catch (e) { fails++; $('#upd').textContent = 'კავშირი არ არის'; }
  finally { busy = false; }
}
tick(true); setInterval(() => tick(false), 10e3);
setInterval(() => { loadConfig().catch(() => {}); }, 3 * 60e3);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(true); });
</script>
</body>
