<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ლაივ ბილეთები</title>
<style>
:root{--bg:#edf1f6;--card:#fff;--fg:#1d1d22;--muted:rgba(29,29,34,.6);--pri:#374df5}
@media (prefers-color-scheme:dark){:root{--bg:#111115;--card:#1b1b21;--fg:#fff;--muted:rgba(255,255,255,.6);--pri:#8b98ff;color-scheme:dark}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,"Segoe UI",sans-serif;padding:16px;box-sizing:border-box}
.c{background:var(--card);border-radius:14px;padding:22px 20px;max-width:420px;width:100%;text-align:center}
h1{font-size:19px;margin:0 0 6px}p{margin:6px 0;color:var(--muted)}a{color:var(--pri);font-weight:600}
</style>
</head>
<body>
<div class="c">
  <h1>ლაივ ბილეთები</h1>
  <p id="msg">ვუკავშირდები…</p>
  <p id="link"></p>
</div>
<script>
const msg = document.getElementById('msg'), link = document.getElementById('link');
async function go() {
  try {
    const t = await (await fetch('tunnel.json?t=' + Date.now(), { cache: 'no-store' })).json();
    link.innerHTML = '<a href="' + t.url + '">' + t.url.replace('https://', '') + '</a>';
    const ok = await fetch(t.url + '/ping?t=' + Date.now(), { cache: 'no-store' }).then(r => r.ok).catch(() => false);
    if (ok) { location.replace(t.url + '/'); return; }
    msg.textContent = 'კომპიუტერი ახლა არ პასუხობს. თუ ის ჩართულია, ბმული ერთ წუთში განახლდება.';
  } catch (e) { msg.textContent = 'ბმული ჯერ არ არის. ვცდი ხელახლა…'; }
  setTimeout(go, 15000);
}
go();
</script>
</body>
</html>
